<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Força o navegador a utilizar esquema de cores claro -->
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">

  <title>Identificação do Pet</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Biblioteca de Ícones Lucide -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>

  <style>
    /* Força modo claro em toda a aplicação */
    :root {
      color-scheme: light !important;
      forced-color-adjust: none;
      
      --ink: #18334b;
      --muted: #668196;
      --coral: #ff7c62;
      --mint: #def7eb;
      --line: #dce7ed;
      --bg-page: #eaf4f6;
      --card-bg: #ffffff;
    }

    /* Anula qualquer media query de modo escuro do sistema */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: light !important;
      }
      html, body {
        background-color: var(--bg-page) !important;
        color: var(--ink) !important;
      }
    }

    * { 
      box-sizing: border-box; 
    }

    html, body {
      background-color: var(--bg-page) !important;
      color: var(--ink) !important;
      color-scheme: light !important;
      width: 100%;
      min-height: 100vh;
      margin: 0;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    .pet-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
      isolation: isolate;
      overflow: hidden;
      background-color: var(--bg-page);
    }

    .pet-page::before,
    .pet-page::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      z-index: -1;
      filter: blur(2px);
    }

    .pet-page::before {
      width: 330px;
      height: 330px;
      top: -145px;
      left: -125px;
      background: #b9e8df;
    }

    .pet-page::after {
      width: 360px;
      height: 360px;
      right: -170px;
      bottom: -170px;
      background: #ffd6c9;
    }

    .pet-card-shell {
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg) !important;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 24px 55px rgba(39, 85, 104, 0.18);
      animation: appear 650ms cubic-bezier(.2,.8,.2,1) both;
    }

    .banner-wrap {
      height: 135px;
      position: relative;
      overflow: hidden;
      background-color: #b9e8df;
    }

    .banner-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(19, 55, 72, 0.05), rgba(19, 55, 72, 0.38));
      pointer-events: none;
    }

    .pet-banner {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      display: block;
    }

    .pet-content {
      position: relative;
      padding: 0 28px 29px;
      text-align: center;
      background-color: var(--card-bg);
    }

    .paw-badge {
      width: 82px;
      height: 82px;
      margin: -42px auto 15px;
      position: relative;
      z-index: 2;
      background-color: #ffffff !important;
      border: 6px solid #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(32, 83, 102, 0.16);
      color: #337c72 !important;
    }

    .paw-badge svg { width: 35px; height: 35px; }

    .info-list {
      text-align: left;
      border-top: 1px solid var(--line);
      margin-top: 15px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 39px minmax(0, 1fr);
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .info-icon {
      width: 39px;
      height: 39px;
      border-radius: 13px;
      background: #edf7f5 !important;
      color: #337c72 !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-icon svg { width: 19px; height: 19px; }

    .info-label {
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.67rem;
      font-weight: 700;
      color: var(--muted) !important;
    }

    .info-value {
      margin: 0;
      color: var(--ink) !important;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .contact-link {
      width: 100%;
      margin-top: 23px;
      min-height: 54px;
      padding: 13px 18px;
      border-radius: 16px;
      background-color: #25d366 !important;
      color: #ffffff !important;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 9px 18px rgba(29, 169, 92, 0.23);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .contact-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 23px rgba(29, 169, 92, 0.27);
    }

    .contact-link svg { width: 21px; height: 21px; }

    .missing-note {
      display: none;
      margin: 20px 0 0;
      padding: 12px 15px;
      border-radius: 14px;
      background: #fff4e8 !important;
      color: #936020 !important;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(16px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>

<body>
  <main class="pet-page">
    <article class="pet-card-shell">
      <div class="banner-wrap">
        <img src="https://www.universodasaudeanimal.com.br/wp-content/uploads/sites/57/2021/07/Cacho-e-gato-juntos-no-chao-posando-pra-foto.jpg" class="pet-banner" alt="Banner Pet" loading="lazy">
      </div>
      
      <div class="pet-content">
        <div class="paw-badge">
          <i data-lucide="paw-print"></i>
        </div>

        <section class="info-list" aria-label="Dados de identificação">
          <div class="info-row">
            <div class="info-icon"><i data-lucide="heart"></i></div>
            <div>
              <span class="info-label">Nome do Pet</span>
              <p id="pet-name" class="info-value">...</p>
            </div>
          </div>

          <div class="info-row">
            <div class="info-icon"><i data-lucide="user-round"></i></div>
            <div>
              <span class="info-label">Responsável</span>
              <p id="owner-name" class="info-value">...</p>
            </div>
          </div>

          <div class="info-row">
            <div class="info-icon"><i data-lucide="phone"></i></div>
            <div>
              <span class="info-label">Telefone</span>
              <p id="owner-phone" class="info-value">...</p>
            </div>
          </div>
        </section>

        <a id="btn-wa" class="contact-link" href="#" target="_blank" rel="noopener noreferrer">
          <i data-lucide="message-circle"></i>
          <span>Falar no WhatsApp</span>
        </a>

        <p id="missing-phone-note" class="missing-note">Nenhum telefone informado para contato.</p>
      </div>
    </article>
  </main>

  <script>
    function getParams() {
      const search = decodeURIComponent(window.location.search);
      if (!search) return { pet: null, dono: null, tel: null };

      const parts = search.substring(1).split("?");
      return {
        pet: parts[0] ? parts[0].replace(/_/g, " ") : null,
        dono: parts[1] ? parts[1].replace(/_/g, " ") : null,
        tel: parts[2] ? parts[2].trim() : null
      };
    }

    function fillPetDetails() {
      const params = getParams();

      document.getElementById("pet-name").textContent = params.pet || "Não informado";
      document.getElementById("owner-name").textContent = params.dono || "Não informado";
      document.getElementById("owner-phone").textContent = params.tel || "Não informado";

      const whatsappButton = document.getElementById("btn-wa");
      const missingPhoneNote = document.getElementById("missing-phone-note");

      if (params.tel) {
        const cleanPhone = params.tel.replace(/\D/g, "");
        const formattedPhone = cleanPhone.length <= 11 ? "55" + cleanPhone : cleanPhone;
        const message = encodeURIComponent("Olá! Encontrei o pet " + (params.pet || "") + ".");

        whatsappButton.href = "https://wa.me/" + formattedPhone + "?text=" + message;
        whatsappButton.style.display = "inline-flex";
      } else {
        missingPhoneNote.style.display = "block";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      fillPetDetails();
      if (typeof lucide !== "undefined") {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
