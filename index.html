    <title>Identificação do Pet</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap"

    <style>
        :root {
            --ink: #18334b;
            --muted: #668196;
            --coral: #ff7c62;
            --mint: #def7eb;
            --line: #dce7ed;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: #eaf4f6;
        }

        body {
            width: 100%;
            min-height: calc(100 * min(var(--vh, 1vh), 1vh));
            margin: 0;
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            overflow-x: hidden;
        }

        .pet-page {
            position: relative;
            width: 100%;
            min-height: calc(100 * min(var(--vh, 1vh), 1vh));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
            isolation: isolate;
            overflow: hidden;
        }

        .pet-page::before,
        .pet-page::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            z-index: -1;
            filter: blur(2px);
        }

        .pet-page::before {
            width: 330px;
            height: 330px;
            top: -145px;
            left: -125px;
            background: #b9e8df;
        }

        .pet-page::after {
            width: 360px;
            height: 360px;
            right: -170px;
            bottom: -170px;
            background: #ffd6c9;
        }

        .pet-card-shell {
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 24px 55px rgba(39, 85, 104, 0.18);
            animation: appear 650ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .banner-wrap {
            height: 135px;
            position: relative;
            overflow: hidden;
        }

        .banner-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(19, 55, 72, 0.05), rgba(19, 55, 72, 0.38));
            pointer-events: none;
        }

        .pet-banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 38%;
            display: block;
        }

        .pet-content {
            position: relative;
            padding: 0 28px 29px;
            text-align: center;
        }

        .paw-badge {
            width: 82px;
            height: 82px;
            margin: -42px auto 15px;
            position: relative;
            z-index: 2;
            border: 6px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(32, 83, 102, 0.16);
        }

        .paw-badge svg {
            width: 35px;
            height: 35px;
        }

        .pet-kicker {
            margin: 0 0 5px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .pet-title {
            margin: 0;
            font-family: "Fraunces", serif;
            line-height: 1.1;
        }

        .pet-description {
            margin: 8px auto 22px;
            max-width: 315px;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .info-list {
            text-align: left;
            border-top: 1px solid var(--line);
        }

        .info-row {
            display: grid;
            grid-template-columns: 39px minmax(0, 1fr);
            gap: 12px;
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
            align-items: center;
        }

        .info-icon {
            width: 39px;
            height: 39px;
            border-radius: 13px;
            background: #edf7f5;
            color: #337c72;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-icon svg {
            width: 19px;
            height: 19px;
        }

        .info-label {
            display: block;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            font-size: 0.67rem;
            font-weight: 700;
        }

        .info-value {
            margin: 0;
            color: var(--ink);
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .contact-link {
            width: 100%;
            margin-top: 23px;
            min-height: 54px;
            padding: 13px 18px;
            border-radius: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            box-shadow: 0 9px 18px rgba(29, 169, 92, 0.23);
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        .contact-link:hover {
            transform: translateY(-2px);
            filter: brightness(0.97);
            box-shadow: 0 13px 23px rgba(29, 169, 92, 0.27);
        }

        .contact-link:active {
            transform: translateY(0) scale(0.985);
        }

        .contact-link:focus-visible {
            outline: 3px solid #18334b;
            outline-offset: 3px;
        }

        .contact-link svg {
            width: 21px;
            height: 21px;
            flex: 0 0 auto;
        }

        .missing-note {
            display: none;
            margin: 20px 0 0;
            padding: 12px 15px;
            border-radius: 14px;
            background: #fff4e8;
            color: #936020;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 380px) {
            .pet-page {
                padding: 18px 13px;
            }

            .pet-content {
                padding-right: 21px;
                padding-left: 21px;
            }

            .banner-wrap {
                height: 118px;
            }
        }

        :root {
            color-scheme: light;
        }
    </style>

    <meta name="color-scheme" content="light" />

<body data-template-id="__page-root">
    <main class="pet-page" aria-labelledby="page-title">
        <article data-template-id="pet-card" class="canva-card pet-card-shell">
            <div class="banner-wrap"><img data-template-id="pet-banner-image" class="canva-image pet-banner"
                    loading="lazy">
            </div>
            <div class="pet-content">
                <div data-template-id="pet-badge" class="canva-banner paw-badge" aria-hidden="true"><i
                        data-lucide="paw-print"></i>
                </div>
                <header>
                    <p data-template-id="page-kicker" class="canva-text pet-kicker"></p>
                    <h1 data-template-id="page-title" class="canva-text pet-title"></h1>
                    <p data-template-id="page-description" class="canva-text pet-description"></p>
                </header>
                <section class="info-list" aria-label="Dados de identificação">
                    <div class="info-row">
                        <div class="info-icon" aria-hidden="true"><i data-lucide="heart"></i>
                        </div>
                        <div><span data-template-id="pet-label" class="canva-text info-label"></span>
                            <p id="pet-name" class="info-value" aria-live="polite">...</p>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-icon" aria-hidden="true"><i data-lucide="user-round"></i>
                        </div>
                        <div><span data-template-id="owner-label" class="canva-text info-label"></span>
                            <p id="owner-name" class="info-value" aria-live="polite">...</p>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="info-icon" aria-hidden="true"><i data-lucide="phone"></i>
                        </div>
                        <div><span data-template-id="phone-label" class="canva-text info-label"></span>
                            <p id="owner-phone" class="info-value" aria-live="polite">...</p>
                        </div>
                    </div>
                </section><a id="btn-wa" data-template-id="contact-button" class="canva-button contact-link" href="#"
                    target="_blank" rel="noopener noreferrer"> <i data-lucide="message-circle" aria-hidden="true"></i>
                    <span data-template-id="contact-button-text" class="canva-text"></span> </a>
                <p id="missing-phone-note" data-template-id="missing-phone-note" class="canva-text missing-note"
                    role="status"></p>
            </div>
        </article>
    </main>
    <script>
        function getParams() {
            const search = decodeURIComponent(window.location.search);

            if (!search) {
                return { pet: null, dono: null, tel: null };
            }

            const parts = search.substring(1).split("?");

            return {
                pet: parts[0] ? parts[0].replace(/_/g, " ") : null,
                dono: parts[1] ? parts[1].replace(/_/g, " ") : null,
                tel: parts[2] ? parts[2].trim() : null
            };
        }

        function fillPetDetails() {
            const params = getParams();

            document.getElementById("pet-name").textContent = params.pet || "Não informado";
            document.getElementById("owner-name").textContent = params.dono || "Não informado";
            document.getElementById("owner-phone").textContent = params.tel || "Não informado";

            const whatsappButton = document.getElementById("btn-wa");
            const missingPhoneNote = document.getElementById("missing-phone-note");

            if (params.tel) {
                const cleanPhone = params.tel.replace(/\D/g, "");
                const formattedPhone = cleanPhone.length <= 11 ? "55" + cleanPhone : cleanPhone;
                const message = encodeURIComponent("Olá! Encontrei o pet " + (params.pet || "") + ".");

                whatsappButton.href = "https://wa.me/" + formattedPhone + "?text=" + message;
                whatsappButton.style.display = "inline-flex";
            } else {
                missingPhoneNote.style.display = "block";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            fillPetDetails();
            lucide.createIcons();
        });
    </script>
</body>

</html>
